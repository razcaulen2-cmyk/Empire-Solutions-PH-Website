<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbe8">
  <meta name="description" content="Empire Solutions PH designs, builds and powers clean-energy systems for Filipino homes and businesses. Solar EPC, from first assessment to ongoing care.">
  <title>Empire Solutions PH — Where Sustainability Is King</title>
  <link rel="icon" type="image/png" href="/assets/empire-mark.png">
  <style>
    .startup-screen {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 82% 18%, rgba(255, 195, 0, .12), transparent 24%),
        linear-gradient(135deg, #ffffff, #fffbe8);
      opacity: 1;
      transition: opacity .34s ease, visibility .34s ease;
    }
    .startup-screen::before, .startup-screen::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }
    .startup-screen::before {
      top: 0;
      right: 0;
      width: min(42vw, 360px);
      height: min(42vw, 360px);
      background-image: radial-gradient(circle, rgba(255, 195, 0, .68) 1.2px, transparent 1.8px);
      background-size: 10px 10px;
      mask-image: radial-gradient(ellipse at top right, #000 0, transparent 76%);
      opacity: .52;
    }
    .startup-screen::after {
      right: 8%;
      bottom: 8%;
      width: min(32vw, 260px);
      height: min(24vw, 190px);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 145, 77, .10), transparent 72%);
    }
    .startup-screen.is-exiting { visibility: hidden; opacity: 0; pointer-events: none; }
    .startup-screen__content { position: relative; z-index: 1; display: grid; justify-items: center; gap: 0; padding: 24px; text-align: center; }
    .startup-sun { position: relative; display: grid; width: 82px; height: 82px; place-items: center; margin-bottom: 27px; border: 1px solid rgba(255, 145, 77, .25); border-radius: 50%; }
    .startup-sun::before { position: absolute; inset: 9px; border: 1px solid rgba(255, 195, 0, .44); border-radius: inherit; content: ""; }
    .startup-sun::after { position: absolute; inset: -5px; border: 1px solid transparent; border-top-color: #ff914d; border-radius: inherit; animation: startup-orbit 1.6s linear infinite; content: ""; }
    .startup-sun span { width: 23px; height: 23px; border-radius: 50%; background: linear-gradient(135deg, #ffcf00, #ff914d); box-shadow: 0 0 30px rgba(255, 145, 77, .5); animation: startup-pulse 1.6s ease-in-out infinite; }
    .startup-screen__wordmark { margin: 0; padding: 0 .16em .1em 0; overflow: visible; color: #ff3131; font-family: "Garet Headline", "Arial", sans-serif; font-size: clamp(32px, 6vw, 43px); font-style: italic; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
    .startup-screen__wordmark span { display: block; padding-top: 8px; color: #000814; font-family: "Garet Regular", "Arial", sans-serif; font-size: 9px; font-style: normal; font-weight: 400; letter-spacing: .36em; }
    .startup-screen__progress { position: relative; width: 154px; height: 2px; overflow: hidden; margin-top: 32px; border-radius: 2px; background: rgba(0, 8, 20, .1); }
    .startup-screen__progress span { position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, #ff3131, #ffc300); animation: startup-progress 1.2s ease-in-out infinite; }
    .startup-screen__message { margin: 17px 0 0; color: #514b43; font-family: "Garet Book", "Arial", sans-serif; font-size: 12px; font-weight: 400; letter-spacing: .02em; }
    .startup-screen__tagline { margin: 36px 0 0; color: #8a8175; font-family: "Garet Regular", "Arial", sans-serif; font-size: 8px; font-weight: 400; letter-spacing: .2em; }
    @keyframes startup-orbit { to { transform: rotate(360deg); } }
    @keyframes startup-pulse { 50% { transform: scale(.82); opacity: .7; } }
    @keyframes startup-progress { 0% { transform: translateX(-100%); } 55% { transform: translateX(0); } 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) {
      .startup-screen, .startup-screen * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="startup-screen" id="startup-screen" role="status" aria-live="polite">
    <div class="startup-screen__content">
      <div class="startup-sun" aria-hidden="true"><span></span></div>
      <p class="startup-screen__wordmark">EMPIRE<span>SOLUTIONS PH</span></p>
      <div class="startup-screen__progress" aria-hidden="true"><span></span></div>
      <p class="startup-screen__message">Preparing your page</p>
      <p class="startup-screen__tagline">WHERE SUSTAINABILITY IS KING.</p>
    </div>
  </div>

  <form name="company-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="company-contact">
    <p><label>Leave this field empty: <input name="bot-field"></label></p>
    <input name="name">
    <input name="email">
    <input name="interest">
    <textarea name="message"></textarea>
  </form>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="/" data-route="home" aria-label="Empire Solutions PH home">
      <img class="brand-mark" src="/assets/empire-mark.png" alt="">
      <span class="brand-wordmark-image" aria-hidden="true">
        <img src="/assets/empire-solutions-ph.png" alt="">
      </span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="Open menu">
      <span></span><span></span>
    </button>

    <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
      <a href="/" data-route="home" aria-current="page">Home</a>
      <a href="/services" data-route="services">Our Services</a>
      <a href="/projects" data-route="projects">Our Projects</a>
      <a href="/about" data-route="about">About Us</a>
      <a class="nav-contact" href="/contact" data-route="contact">Contact us <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div id="page-outlet" data-page-outlet aria-busy="true"></div>
  </main>

  <footer class="site-footer page-gutter">
    <div class="footer-bottom">
      <span>© <span id="current-year"></span> Empire Solutions PH</span>
      <span>WHERE SUSTAINABILITY IS KING.</span>
      <a href="/" data-route="home">BACK TO TOP ↑</a>
    </div>
  </footer>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
